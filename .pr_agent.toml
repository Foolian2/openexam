[config]
# Dated snapshot slug; OpenRouter's "-latest" aliases aren't callable.
model = "openrouter/deepseek/deepseek-v4-flash-0731"
fallback_models = ["openrouter/qwen/qwen3.7-flash"]
# custom_model_max_tokens, max_model_tokens, reasoning_effort and pr_actions
# are set as env vars in pr-agent.yml; setting them here has no effect.

[pr_reviewer]
require_security_review = true
extra_instructions = """
This is OpenExam, an exam-taking platform whose anti-cheat is built on Safe
Exam Browser (SEB) integration. Treat changes to the following as
security-sensitive by default and flag them as high/critical severity unless
clearly benign:
- lib/seb*.ts (Config Key derivation, BEK pinning, quit-password hashing,
  fail-closed guard logic in lib/seb-guard.ts)
- ws-backend/internal/seb/ (must stay byte-for-byte compatible with the TS
  side — flag any change here that isn't mirrored on the other side, and
  vice versa)
- app/exam/[id]/quit (must remain a full page navigation, not next/link,
  or SEB quit detection breaks)
- lib/auth.ts, app/api/auth/**, lib/access-code.ts, lib/rate-limit.ts

Rank every finding by severity (critical/high/medium/low) and call out
security-relevant changes explicitly, even when the PR is not primarily
about security.
"""

[pr_code_suggestions]
# num_code_suggestions (without _per_chunk) is not a valid key.
num_code_suggestions_per_chunk = 6
suggestions_score_threshold = 0

[github_action_config]
auto_review = true
auto_describe = true
auto_improve = true

[artifacts]
artifact_instructions = """
Semgrep SAST findings for this PR's diff. Ground the review's security
section in these results: confirm/rank their severity in context, don't
re-report them as separate low-confidence guesses, and call out anything
Semgrep would miss (e.g. SEB Config Key/BEK logic, auth flow issues) as
additional findings.
"""
