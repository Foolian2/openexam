# Production reverse proxy (PRD §16.2): TLS termination, /ws/ WebSocket
# proxying to the Go backend, everything else to the Next.js web tier.
#
# Mounted as /etc/nginx/nginx.conf.template and rendered at container start
# with envsubst (docker-compose.prod.yml's nginx command), substituting
# ${OPENEXAM_DOMAIN}. That single variable pins server_name so a request
# carrying any other Host header is answered with 444 by the catch-all
# server below instead of reaching the app — without it, better-auth (and
# anything else building absolute URLs) would derive its base URL from the
# attacker-supplied Host. Set OPENEXAM_DOMAIN in .env.prod; the container
# refuses to start with an empty value (nginx -t fails), on purpose.
#
# Certs are read from the fixed directory /etc/letsencrypt/live/openexam —
# point ./certs/live/openexam at your real cert directory (see
# DEPLOYMENT.md).

user nginx;
# Not `auto`: inside the container `auto` counts the HOST's vCPUs (8 on the
# 16 GB Hetzner box), not the 1-2 CPU quota in docker-compose.prod.yml. Eight
# workers at 33-56 MiB RSS each (2026-10-13 benchmark, N3200) exceeded the
# old 256M memory limit and the kernel OOM-killed workers, which dropped
# every WebSocket they held. Four workers x worker_connections 4096 still
# leaves 16384 slots, enough for 4000 students (two slots per proxied
# connection) plus monitors and REST keepalives.
worker_processes 4;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Without this, worker_connections below is a promise nginx cannot keep: each
# worker inherits the container's RLIMIT_NOFILE soft limit (1024 by default),
# and every proxied connection costs TWO descriptors — one to the client, one
# to the upstream. That caps a worker at ~512 connections regardless of the
# 4096 configured, and the failure is brutal and silent from the app's side:
# nginx logs "accept4() failed (24: No file descriptors available)" and
# returns its own 500 page, so requests never reach Next.js and nothing
# appears in the web tier's logs.
#
# Raised so worker connections, not file descriptors, are the limit.
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Don't hand an attacker the exact nginx version for free in the
    # Server header and default error pages.
    server_tokens off;

    # TLS session resumption: without a shared cache every HTTPS connection
    # pays a full handshake, which costs most exactly when it hurts most —
    # the exam-start burst (many students' browsers connecting within
    # seconds of each other, per docker-compose.prod.yml's replica-sizing
    # note). Tickets are turned off in favor of the cache: nginx doesn't
    # rotate its auto-generated ticket key across reloads/restarts, so a
    # long-lived key is a weaker forward-secrecy story than the cache.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling: nginx fetches and caches the certificate's revocation
    # status itself and staples it to the handshake, instead of every
    # client round-tripping to the CA's OCSP responder. ssl_trusted_certificate
    # verifies that response; fullchain.pem already carries the
    # intermediate, so it doubles as the trust chain here. The resolver is
    # required to look up the OCSP responder host (it isn't in the cert).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/openexam/fullchain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # SEB attestation tokens used to ride in the WS query string (browsers
    # can't set custom headers on a WebSocket), and an old or rolled-back
    # client may still send ?sebKey=&bekKey= — the default log_format's
    # $request would dump them into the access log verbatim. The dedicated
    # ws format omits the request line and query entirely.
    # $request_method + $uri, never $request: $request is the raw request line
    # including the query string, and SEB sign-in tokens also ride in ?ott= and
    # ?lt= on the launch link, the .seb startURL and the seb-config/seb-enter
    # routes — not just ?sebKey=/?bekKey= on the WS. $uri is the decoded path
    # with no query, so an unredeemed single-use OTT can't be lifted from the
    # access log within its 5-minute TTL.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    log_format ws_only '$remote_addr - [$time_local] "$request_method /ws/ HTTP/$server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Second access log, in a machine-readable format, shipped over UDP syslog
    # to nginx-log-exporter (docker-compose.prod.yml) which turns it into the
    # Prometheus histograms behind the p95 REST / page-load SLO alerts. stub_status
    # — all nginx-exporter can read — has no per-status-code or per-route
    # breakdown, which is why monitoring/prometheus/rules/alerts.yml used to
    # carry a comment saying an error-rate alert was not available from this
    # stack. This is what makes it available.
    #
    # Syslog rather than a shared log file because /var/log/nginx/access.log in
    # nginx:alpine is a symlink to /dev/stdout — there is no file to tail.
    #
    # 127.0.0.1, and a literal address rather than a container name, on purpose
    # and load-bearing. nginx resolves a syslog `server=` hostname when it PARSES
    # the config, not lazily at log time, and a name it cannot resolve is a hard
    # startup failure. Pointing this at a container name would mean the edge
    # proxy for the entire site refuses to boot whenever a monitoring container
    # is missing — and this stack's monitoring is explicitly optional and
    # removable (see docker-compose.prod.yml's header). So the exporter runs
    # inside nginx's own network namespace instead and this stays loopback: it
    # always parses, with or without monitoring deployed.
    #
    # UDP, so when the exporter is not running the datagrams are simply dropped.
    # Nothing blocks, nothing fails, metrics stop and requests do not.
    #
    # $route (not $uri) and no $request: the metrics log must stay
    # low-cardinality AND must never carry a query string. SEB attestation
    # tokens ride in ?sebKey=&bekKey= on some client versions — the same reason
    # the ws_only format above omits the request line entirely.
    #
    # $route is defined by the map block below, grouped with the other map.
    log_format metrics '$route $request_method $status $request_time $upstream_response_time';
    access_log syslog:server=127.0.0.1:9514,facility=local7,tag=nginx,severity=info metrics;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Collapses request paths to a bounded set of route labels. nginx evaluates
    # these regexes in order, first match wins, so the specific hot paths come
    # before the family catch-alls.
    #
    # This taxonomy lives here rather than in the exporter's relabel config so
    # it sits next to the location blocks it describes. Keep it under ~20
    # values: every label here multiplies by status code and histogram bucket
    # in Prometheus, and this box runs the monitoring stack alongside the app.
    #
    # /ws/ is deliberately absent: that location declares its own access_log
    # (ws_only), which per nginx's inheritance rules replaces the http-level
    # logs entirely for that block. WebSocket connections are long-lived, so
    # their $request_time is connection duration, not latency — including them
    # would destroy the histogram. WS latency is measured inside ws-backend
    # (openexam_ws_answer_ack_seconds) where per-frame timing actually exists.
    map $uri $route {
        default                                             other;

        # Hot paths worth isolating: answer autosave is the REST fallback for
        # the WS path, and /take is the page every student renders at exam start.
        ~^/api/sessions/[^/]+/answers$                      api_answers;
        ~^/api/sessions/[^/]+/upload$                       api_upload;
        ~^/exam/[^/]+/take$                                 page_take;

        ~^/api/auth/                                        api_auth;
        ~^/api/exams                                        api_exams;
        ~^/api/sessions                                     api_sessions;
        ~^/api/question-bank                                api_question_bank;
        ~^/api/folders                                      api_folders;
        ~^/api/admin                                        api_admin;
        ~^/api/teacher                                      api_teacher;
        ~^/api/audit                                        api_audit;
        ~^/api/monitoring                                   api_monitoring;
        ~^/api/(health|ready|metrics)$                      api_probe;
        ~^/api/                                             api_other;

        ~^/_next/static/                                    static;
        ~^/exam/                                            page_exam;
        ~^/dashboard                                        page_dashboard;
        ~^/(login|register|register-teacher|verify-email|forgot-password|reset-password)$  page_auth;

        # Both spellings of the Cap widget path: the location that serves it
        # rewrites /cap-api/<sitekey>/challenge to /<sitekey>/challenge, and
        # $uri reflects the rewritten value by the time the request is logged.
        ~^/cap-api/                                         cap;
        "~^/[a-f0-9]{10}/(challenge|redeem)$"               cap;

        /                                                   page_root;
    }

    # Is this request carrying a Better Auth session? The cookie is emitted
    # bare in development and with the `__Secure-` prefix in production, and
    # both spellings contain the same substring, so one regex covers them.
    #
    # Matched against the raw $http_cookie rather than $cookie_<name>: nginx
    # variable names are restricted to [A-Za-z0-9_], so the dot in
    # `better-auth.session_token` cannot be expressed as a $cookie_ variable
    # at all — $cookie_better_auth_session_token would silently look for a
    # differently named cookie and always come back empty, which would hand
    # every logged-in visitor the cached anonymous page.
    map $http_cookie $openexam_has_session {
        default                          0;
        "~*better-auth\.session_token="  1;
    }

    # Micro-cache for the anonymous landing page (see `location = /`). One
    # entry, so the zone is sized for the metadata rather than the content;
    # max_size bounds it anyway if the key set ever grows.
    proxy_cache_path /var/cache/nginx/landing levels=1:2 keys_zone=landing:1m
                     max_size=16m inactive=10m use_temp_path=off;

    # /api/ready issues one query/check against each of Postgres, Redis, and
    # MinIO. It must be publicly reachable for external monitoring, but it is
    # deliberately not a general-purpose status endpoint: cap both a single
    # client and the total edge traffic before it reaches any dependency. The
    # global key is server_name (rather than Host) because nginx rejects
    # unknown hosts before this server and Host remains client-controlled.
    limit_req_zone $binary_remote_addr zone=ready_per_ip:10m rate=1r/s;
    limit_req_zone $server_name zone=ready_global:10m rate=2r/s;

    # nginx resolves these names once, at config load, expanding every A
    # record Docker's DNS returns into the upstream group — so replicas are
    # balanced, but the address list goes stale when a replica is recreated
    # or the replica count changes. `nginx -s reload` re-resolves; that's why
    # scripts/deploy.sh reloads after a deploy.
    #
    # keepalive here pools idle nginx→upstream connections instead of
    # opening a fresh TCP connection (handshake latency + TIME_WAIT churn)
    # per proxied request. Requires proxy_http_version 1.1 and a cleared
    # Connection header on each location using this upstream — see below.
    # Not added to `websocket`: each WS session already holds one long-lived
    # connection for its lifetime (proxy_read_timeout 86400 below), so there
    # is no per-request connection churn there to pool.
    # least_conn over the default round-robin: SSR render cost varies per
    # request (a plain page vs. an exam page), so routing by active
    # connection count spreads that uneven cost more evenly across replicas
    # than blind rotation, especially during an exam-start burst.
    upstream nextjs {
        least_conn;
        server web:3000;
        keepalive 32;
    }

    upstream websocket {
        server ws-backend:8080;
    }

    upstream cap {
        server cap:3000;
    }

    # Loopback-only status endpoint (read via `docker exec nginx`). Bound to
    # 127.0.0.1 inside the container, so it is not reachable from the edge
    # network and never published by docker-compose.
    server {
        listen 127.0.0.1:8081;
        server_name _;
        access_log off;

        location /nginx_status {
            stub_status;
        }
    }

    # Same stub_status output, bound to the container's real interface (not
    # loopback) so nginx-exporter — a separate container on the `edge`
    # network (docker-compose.prod.yml) — can scrape it. Not published by
    # docker-compose (no host `ports:` entry for this listener), so it's
    # reachable only from other containers on `edge`, never the internet.
    server {
        listen 8082;
        server_name _;
        access_log off;

        location /nginx_status {
            stub_status;
        }
    }

    # Catch-all: any Host other than the configured domain is refused with
    # 444 (close without response) instead of being routed to the app.
    # Without default_server, nginx would fall back to the first defined
    # server block — this server is defined first for exactly that reason.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/openexam/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/openexam/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        return 444;
    }

    server {
        listen 80;
        server_name ${OPENEXAM_DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${OPENEXAM_DOMAIN};

        # ./certs/live/openexam is a fixed directory name; certbot output is
        # symlinked/copied there so this config never changes per domain.
        ssl_certificate /etc/letsencrypt/live/openexam/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/openexam/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Server-wide, so it also covers non-upload routes. FILE_UPLOAD files
        # are capped well below it (MAX_UPLOAD_MB in lib/upload-budget.ts).
        client_max_body_size 110m;

        # Bound multipart buffering before Next.js sees the body: 25 MB file
        # plus 1 MB for fields and multipart headers. Other routes keep 110 MB.
        location ~ ^/api/sessions/[^/]+/upload$ {
            client_max_body_size 26m;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket → Go backend (exam sessions, teacher monitor)
        location /ws/ {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append): nginx is the only edge proxy, so the
            # app can treat X-Forwarded-For as the true client IP. $remote_addr
            # is the real socket peer, which a client cannot forge. If another
            # proxy layer is ever added in front, re-evaluate this.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            # SEB attestation no longer rides in the query string: the tokens
            # travel as the socket's first message (see ws-backend/main.go's
            # sebHandshake). Logging the bare handshake without request line
            # or query string is defense-in-depth against a rollback or an
            # old client still sending ?sebKey=&bekKey=.
            access_log /var/log/nginx/access.log ws_only;
        }

        # Cap widget (self-hosted CAPTCHA) — the PoW challenge runs in the
        # student's browser, so it needs a public path distinct from the
        # server-only /siteverify call `web` makes over the internal network.
        #
        # Only the two widget routes are proxied, and only under a site-key-
        # shaped segment: Cap generates site keys as 10 lowercase hex chars
        # (randomBytes(5)), and the widget (@cap.js/widget) only ever POSTs
        # to <endpoint>challenge and <endpoint>redeem. Cap's admin dashboard
        # and API live at the upstream's root and under /server/, /auth/,
        # /assets/ — none of which match this shape — so they stay
        # unreachable from the internet (SSH-tunnel only). A brute-forced
        # ADMIN_KEY would otherwise reveal CAP_SECRET_KEY and let an attacker
        # create/delete site keys, i.e. bypass or DoS the entire bot-check.
        #
        # A regex location cannot use proxy_pass's URI part to strip a
        # prefix (nginx rejects it), so a rewrite drops /cap-api/ and
        # proxy_pass carries the site-key path to Cap's own root, matching
        # what NEXT_PUBLIC_CAP_WIDGET_ENDPOINT points the client at. The
        # regex must be quoted: nginx treats braces in unquoted arguments
        # as config syntax and would fail to parse the {10} quantifier.
        location ~ "^/cap-api/[a-f0-9]{10}/(challenge|redeem)$" {
            rewrite ^/cap-api/(.*)$ /$1 break;
            proxy_pass http://cap;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Hashed, immutable build assets (JS/CSS/fonts). Next.js fingerprints
        # these URLs per build, so browsers can cache them forever.
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, matching every other location: nginx is the only edge
            # proxy, so the app treats X-Forwarded-For as the true client IP
            # (lib/client-ip.ts). Nothing audit-logs from this static-asset
            # path today, but appending here would leave one block trusting a
            # client-supplied value and is the wrong thing to copy from.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # expires alone would emit a second Cache-Control header (browsers
            # take the first one and silently drop "immutable"), so set the
            # full directive explicitly instead of pairing it with expires.
            add_header Cache-Control "public, immutable, max-age=31536000";
        }

        # Prometheus scrapes web:3000/api/metrics directly over the internal
        # Docker network (docker-compose.prod.yml) — this route must never be
        # internet-reachable through nginx. Defense-in-depth: the route
        # itself has no auth (app/api/metrics/route.ts), so this block is
        # what actually keeps it private if that ever changes.
        location = /api/metrics {
            deny all;
            return 404;
        }

        # Deep readiness is intentionally public so an external monitor can
        # observe every production dependency. Each request does a Postgres
        # query, Redis PING, and S3 HeadBucket, so constrain it at the edge
        # before proxying. The bursts accommodate a monitor retry while the
        # sustained global limit prevents a distributed flood from consuming
        # dependency connections. Return 429 rather than pretending the stack
        # itself is unhealthy with a 503.
        location = /api/ready {
            limit_req zone=ready_per_ip burst=3 nodelay;
            limit_req zone=ready_global burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The front door, and the single most cacheable render in the app.
        # Logged out, `/` is the same handful of static elements for every
        # visitor, yet Next.js marks it (like every dynamic page) no-store, so
        # each hit paid a full server render. Thirty seconds of
        # micro-caching caps the landing page at two renders a minute no
        # matter how hard the door is pushed, which is most of the anonymous
        # front-door capacity problem for no infrastructure at all.
        #
        # Scoped to `/` on purpose. /login and /register are the other
        # logged-out pages, but they embed per-render CAPTCHA state and are
        # the target of the auth rate limiters — caching a shared copy of
        # either is a correctness problem, not a saving.
        #
        # Correctness of the cached copy rests on three things:
        #   - $openexam_has_session routes anyone holding a session cookie
        #     straight to the upstream (bypass) and keeps their personalized
        #     render out of the cache (no_cache), so the "Willkommen zurück,
        #     <name>" variant can never be served to somebody else.
        #   - Set-Cookie is deliberately NOT in proxy_ignore_headers: nginx
        #     refuses to cache any response carrying one, which is the
        #     backstop if this page ever starts issuing a cookie anonymously.
        #   - Cache-Control/Expires ARE ignored, because Next.js's no-store on
        #     dynamic pages is what this block exists to override. The header
        #     still reaches the browser, so only the shared edge caches.
        location = / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache landing;
            proxy_cache_key "$scheme://$host/";
            proxy_cache_valid 200 30s;
            proxy_ignore_headers Cache-Control Expires;

            proxy_cache_bypass $openexam_has_session;
            proxy_no_cache $openexam_has_session;

            # The two directives that make this burst-proof rather than just
            # cheap: cache_lock sends one request upstream on a cold miss and
            # queues the rest behind it instead of forwarding all of them, and
            # use_stale/background_update serves the expiring copy while a
            # single request refreshes it. Without them each expiry would
            # re-create in miniature the stampede this is here to absorb.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout
                                  http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Next.js web tier (4 replicas, balanced by least_conn — see the
        # nextjs upstream above)
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
