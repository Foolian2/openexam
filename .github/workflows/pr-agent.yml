name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  # Explicitly listing any permission zeroes out the rest.
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Scoped SAST pass so PR-Agent can ground its security review in real
  # findings instead of guessing. Independent of security.yml's full-repo
  # Semgrep job — this one only needs to produce a SARIF file for this PR.
  semgrep:
    if: ${{ github.event_name == 'pull_request' }}
    name: Semgrep (for PR-Agent context)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      # Pinned by digest, matching security.yml — a mutable `latest` tag can
      # be re-pointed by the upstream repo (supply chain).
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep
        run: semgrep ci --config p/ci --config p/typescript --config p/golang --config p/rust --config .github/semgrep.yml --sarif --output semgrep.sarif
        env:
          SEMGREP_RULES: ""

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 1

  pr_agent_job:
    needs: [semgrep]
    # needs.semgrep can be skipped (issue_comment events) or fail without
    # blocking the review — only a hard cancel should stop PR-Agent.
    #
    # Who may trigger it: PR-Agent spends the OpenRouter key and posts with a
    # write token. issue_comment runs in this repo's context with secrets, so
    # on a public repo any GitHub user could otherwise trigger it from any
    # issue or PR — limit comment triggers to the owner and collaborators, on
    # PRs only. Fork PRs get no secrets on pull_request anyway, so skip them
    # instead of failing.
    if: >-
      ${{ always() && github.event.sender.type != 'Bot' && needs.semgrep.result != 'cancelled' && (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      ) }}
    runs-on: ubuntu-latest
    name: AI review (PR-Agent, via OpenRouter)
    steps:
      - name: Download Semgrep SARIF
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: semgrep-sarif
          path: .

      # Pinned to the release commit SHA, not the mutable tag.
      - name: PR Agent action step
        uses: The-PR-Agent/pr-agent@8e5a9295973b24af4b70cafd0b660a230811ef9e # v0.47.0
        with:
          artifact_path: semgrep.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          config.restricted_mode: "true"
          # These keys only take effect as env vars, not in .pr_agent.toml.
          config.custom_model_max_tokens: "128000"
          # The real diff-packing budget; the 32000 default drops files on
          # large PRs.
          config.max_model_tokens: "100000"
          openrouter.reasoning_effort: "max"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'
