# Keep every bundled secret rule active. Exceptions below apply only to
# generic-api-key, only in the named file, and only to the exact known
# public values enumerated in each entry -- never a shape or field pattern.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Public alphabet used to generate random SEB quit passwords"
  condition = "AND"
  paths = ['''(^|/)lib/seb-config\.ts$''']
  regexes = ['''^ABCDEFGHJKLMNPQRSTUVWXYZ23456789$''']

  [[rules.allowlists]]
  description = "Reproducible SHA-256 token shared with the TypeScript test"
  condition = "AND"
  paths = ['''(^|/)ws-backend/internal/seb/seb_test\.go$''']
  regexes = ['''^31dbc8371cd20d4a0606f137a0027bcc797574e2b4ed79462b1d74e44b47fab5$''']

  [[rules.allowlists]]
  description = "Historical synthetic Config Key in the original SEB unit test"
  condition = "AND"
  paths = ['''(^|/)__tests__/seb\.test\.ts$''']
  # This value survives only in git history (no current file contains it);
  # keeping it is what lets full-history scans pass.
  regexes = ['''^abc123def456$''']

  # Cross-language hash vectors: allow just the known key/digest values in
  # their key/digest fields, leaving other secrets (and other secret rules)
  # detectable even in these fixtures. Each regex pins one exact public test
  # vector together with its field shape; a shape-only pattern such as
  # "any 64-hex in this field" would also mask a planted canary.
  [[rules.allowlists]]
  description = "Synthetic Browser Exam Key in shared SEB hash vectors"
  condition = "AND"
  paths = ['''(^|/)testdata/seb-token-vectors\.json$''']
  regexTarget = "match"
  regexes = [
    '''^key": "3f9a1c2b4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8"$''',
  ]

  [[rules.allowlists]]
  description = "SHA-256 digests of the adjacent canonical SEB settings strings"
  condition = "AND"
  paths = ['''(^|/)testdata/seb-config-key-strings\.json$''']
  regexTarget = "match"
  regexes = [
    '''^configKey": "23b7e7ab30f2d297d38d27946f6994793930d04d9b664a97bab87afc9b8ad5a9"$''',
    '''^configKey": "1e0bae8018acdd0759a74221130a694aacf4c791c7914fd691c468ce27d2b73e"$''',
    '''^configKey": "d5868f70fc7ab82794be9b825fe32ff45c3ab72fafcc7a3835940d3e69d195d3"$''',
    '''^configKey": "90eda1e4b83a062358f61a217c6aede2858f4e88f62da8864a1574ca1b0645e4"$''',
    '''^configKey": "a4fb5cdea6bb6e661ed8e93cbb0d482a52c7aeb1c4549516a2e33c88418dd4c6"$''',
  ]
